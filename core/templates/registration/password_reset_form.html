{% extends "registration/base.html" %}

{% block title %}Reset password{% endblock %}
{% block content %}
  <h1>Reset password</h1>
  <p>Enter your staff account email address. If an eligible account exists, reset instructions will be sent.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
  </form>
{% endblock %}
