{% extends "registration/base.html" %}

{% block title %}Staff sign in{% endblock %}
{% block content %}
  <h1>Staff sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
  <p><a href="{% url 'password_reset' %}">Forgot password?</a></p>
{% endblock %}
